<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>OpenChat 本地 WebUI</title>
  <style>
    body { font-family: sans-serif; background: #111; color: #eee; margin: 0; padding: 0; }
    #chat { padding: 20px; max-width: 800px; margin: auto; }
    .msg { margin: 10px 0; white-space: pre-wrap; }
    .user { color: #0f0; }
    .ai { color: #0ff; }
    #inputBox { width: 100%; padding: 10px; font-size: 1rem; }
  </style>
</head>
<body>
  <div id="chat"></div>
  <textarea id="inputBox" rows="3" placeholder="输入你的问题，按 Enter 发送..."></textarea>
  <script src="ollama.js"></script>
</body>
</html>
